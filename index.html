
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gestion des commandes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="container py-4">
        <h1 class="text-center">Gestion des commandes</h1>
        <p class="text-center text-secondary">
            Clients, produits et commandes
        </p>
    </header>

    <main class="container pb-5">

        <div id="error-message" class="alert alert-danger d-none"></div>

        <!-- Indicateurs -->
        <section id="indicators" class="row g-3 mb-4"></section>

        <!-- Recherche et filtres -->
        <section class="row g-3 mb-4">

            <div class="col-md-6">
                <label for="search" class="form-label">
                    Rechercher un client
                </label>
                <input
                    id="search"
                    class="form-control"
                    type="search"
                    placeholder="Nom du client..."
                >
            </div>

            <div class="col-md-3">
                <label for="status-filter" class="form-label">
                    Statut
                </label>
                <select id="status-filter" class="form-select">
                    <option value="">Tous les statuts</option>
                    <option value="Livree">Livree</option>
                    <option value="En attente">En attente</option>
                    <option value="Annulee">Annulee</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="category-filter" class="form-label">
                    Catégorie
                </label>
                <select id="category-filter" class="form-select">
                    <option value="">Toutes les catégories</option>
                    <option value="Informatique">Informatique</option>
                    <option value="Accessoires">Accessoires</option>
                    <option value="Audio">Audio</option>
                </select>
            </div>

        </section>

        <!-- Liste des commandes -->
        <section>
            <h2 class="h4 mb-3">Liste des commandes</h2>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>N°</th>
                            <th>Client</th>
                            <th>Date</th>
                            <th>Statut</th>
                            <th>Total</th>
                            <th>Détail</th>
                        </tr>
                    </thead>

                    <tbody id="orders-list"></tbody>

                </table>
            </div>
        </section>

        <!-- Détail d'une commande -->
        <section id="order-detail" class="mt-4"></section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
